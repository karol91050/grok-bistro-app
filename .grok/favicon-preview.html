<!DOCTYPE html>
<html>
<head>
  <style>
    html, body { margin: 0; background: #888; }
    .row { display: flex; gap: 16px; padding: 16px; align-items: end; }
    .cell { background: #ddd; padding: 8px; }
    img { display: block; image-rendering: pixelated; }
  </style>
</head>
<body>
  <div class="row">
    <div class="cell"><img src="favicon.svg" width="16" height="16"></div>
    <div class="cell"><img src="favicon.svg" width="32" height="32"></div>
    <div class="cell"><img src="favicon.svg" width="64" height="64"></div>
  </div>
</body>
</html>
